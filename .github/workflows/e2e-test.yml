name: Playwright Tests

on:
  deployment_status:

concurrency:
  group: e2e-${{ github.event.deployment_status.target_url }}
  cancel-in-progress: true

jobs:
  run-e2es:
    if: github.event_name == 'deployment_status' && github.event.deployment_status.state == 'success' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
          bun-version-cache: true
      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-install-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-install-
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('bun.lock') }}
          restore-keys: |
            playwright-
      - name: Install packages
        run: bun install && bunx playwright install --with-deps
      - name: Run tests
        run: bunx playwright test
        env:
          BASE_URL: ${{ github.event.deployment_status.environment_url }}